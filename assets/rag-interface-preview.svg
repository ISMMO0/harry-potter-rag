<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Potter RAG application interface</title>
  <desc id="desc">Dark blue question answering interface showing a cited Horcrux answer and retrieved sources.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020713"/>
      <stop offset="0.55" stop-color="#081a36"/>
      <stop offset="1" stop-color="#020713"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="5%" r="65%">
      <stop offset="0" stop-color="#286bc5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#286bc5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <circle cx="1180" cy="125" r="2" fill="#9fc8ff"/><circle cx="1110" cy="185" r="1.5" fill="#9fc8ff"/>
  <circle cx="1270" cy="230" r="1.5" fill="#9fc8ff"/><circle cx="1030" cy="95" r="1.2" fill="#9fc8ff"/>

  <rect x="120" y="58" width="1200" height="784" rx="28" fill="#030b1d" fill-opacity=".84" stroke="#315b91" stroke-width="2" filter="url(#shadow)"/>

  <text x="190" y="130" fill="#78aef3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">THE WIZARDING ARCHIVE</text>
  <text x="190" y="214" fill="#f5f8ff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-3">Potter</text>
  <text x="386" y="214" fill="#78aef3" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">RAG</text>
  <text x="190" y="256" fill="#aabbd2" font-family="Arial, Helvetica, sans-serif" font-size="22">Local retrieval · grounded answers · visible evidence</text>

  <rect x="190" y="294" width="220" height="38" rx="19" fill="#0c2448" stroke="#376cae"/>
  <text x="214" y="319" fill="#d6e5f8" font-family="Arial, Helvetica, sans-serif" font-size="16">AI answers on · 7 documents</text>

  <rect x="190" y="366" width="1060" height="190" rx="20" fill="#07152d" stroke="#376cae" stroke-width="2"/>
  <text x="224" y="408" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Your question</text>
  <rect x="224" y="430" width="992" height="56" rx="12" fill="#202d42"/>
  <text x="248" y="466" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">What is a Horcrux?</text>
  <rect x="224" y="500" width="992" height="40" rx="10" fill="#245b9f" stroke="#4a91e8"/>
  <text x="720" y="527" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ask</text>

  <text x="190" y="615" fill="#f5f8ff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Answer</text>
  <rect x="190" y="640" width="1060" height="82" rx="16" fill="#050d1d" stroke="#34465f"/>
  <text x="220" y="675" fill="#eef4fc" font-family="Arial, Helvetica, sans-serif" font-size="18">A Horcrux contains a portion of a person’s soul, allowing them to survive</text>
  <text x="220" y="703" fill="#eef4fc" font-family="Arial, Helvetica, sans-serif" font-size="18">bodily destruction. <tspan fill="#78aef3" font-weight="700">[1]</tspan></text>

  <text x="190" y="772" fill="#f5f8ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">Retrieved sources</text>
  <rect x="190" y="790" width="1060" height="34" rx="10" fill="#081326" stroke="#2e405a"/>
  <text x="216" y="813" fill="#cbd9ec" font-family="Arial, Helvetica, sans-serif" font-size="15">[1] 06-half-blood-prince.md  ·  passage evidence  ·  retrieval score</text>
</svg>
